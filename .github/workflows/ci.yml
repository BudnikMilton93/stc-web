name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Testcontainers levanta un Postgres real en Docker para
      # Stc.Api.Tests (la API mapea enums nativos de Postgres, no
      # soportados por InMemory/SQLite). ubuntu-latest ya trae Docker
      # Engine corriendo, no hace falta configurar nada extra.
      - run: dotnet restore Stc.Api.slnx
      - run: dotnet build Stc.Api.slnx --no-restore --configuration Release
      - run: dotnet test Stc.Api.slnx --no-build --configuration Release
