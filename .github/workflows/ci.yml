name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Testcontainers levanta un Postgres real en Docker para
      # Stc.Api.Tests (la API mapea enums nativos de Postgres, no
      # soportados por InMemory/SQLite). ubuntu-latest ya trae Docker
      # Engine corriendo, no hace falta configurar nada extra.
      - run: dotnet restore Stc.Api.slnx
      - run: dotnet build Stc.Api.slnx --no-restore --configuration Release
      - run: dotnet test Stc.Api.slnx --no-build --configuration Release

  deploy-api:
    name: Deploy API a Azure (Docker)
    needs: api
    # Solo en push a main, nunca en PR: evita pushear imagenes ni tocar el
    # App Service de produccion desde una rama que todavia no se mergeo.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Requerido por azure/login para el intercambio OIDC (federated
      # credential) contra Azure AD: sin esto no puede pedir el token de
      # identidad de este job. No usamos un client secret de larga
      # duracion — Azure lo deshabilito por default en el App Service
      # (Basic Auth) y ademas OIDC es el mecanismo recomendado hoy.
      id-token: write
    env:
      IMAGE: ghcr.io/budnikmilton93/stc-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Los runners de GitHub Actions ya corren nativo en amd64 (a diferencia
      # de una Mac Apple Silicon, ver docs/roadmaps/01-produccion.md #5), asi
      # que este build no depende de emulacion QEMU. Se etiqueta ademas con
      # el SHA del commit (no solo :latest) para que cada deploy apunte a una
      # imagen distinta y Azure la vuelva a pullear siempre, en vez de
      # potencialmente reusar una capa cacheada con el mismo tag.
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sin publish-profile: usa la sesion ya autenticada por azure/login
      # de arriba (OIDC), en vez de una credencial de Basic Auth.
      #
      # resource-group-name es necesario: el rol Website Contributor del
      # service principal esta scopeado solo al recurso stc-api (no al
      # resource group ni la subscription), asi que no puede *listar/buscar*
      # el App Service por nombre en toda la subscription (lo que la action
      # hace por default sin este dato) — con el resource group explicito,
      # apunta directo al recurso sin necesitar ese permiso mas amplio.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: stc-api
          resource-group-name: stc-web-rg
          images: ${{ env.IMAGE }}:${{ github.sha }}
